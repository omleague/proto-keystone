repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies: ["pydantic", "types-PyYAML"]

  - repo: local
    hooks:
      - id: block-superdoc
        name: Block committing PK0 superdocs
        language: system
        pass_filenames: false
        entry: bash -c 'if git diff --cached --name-only | grep -E
          "^(build/|demo/build/).*PK0_SUPERDOC.*\\.md$" >/dev/null; then echo
            "✗ Refusing to commit superdoc artifacts (confidential)"; exit 1; fi'
