# PK0 Manifest — Seven-Section Architecture (Final)
superdoc_output: 'build/PK0_SUPERDOC.txt'
provenance_footer: true

sections:
  - heading: 'I. FUNDAMENTALS (THE PUBLIC FACE)'
    doc_dirs:
      - 'G:/My Drive/THE_LEAGUE/OM LEAGUE DOCS'
    doc_exts: ['.txt', '.md']
    exclude_globs: ['**/__pycache__/*', '.git/*']

  - heading: 'II. REBOOT SHEETS (THE DOCTRINE)'
    doc_dirs:
      - 'G:/My Drive/THE_LEAGUE/REBOOT'
    doc_exts: ['.txt', '.md']
    exclude_globs: ['**/__pycache__/*', '.git/*']

  - heading: 'III. CODEX (THE LAW)'
    doc_dirs:
      - 'G:/My Drive/THE_LEAGUE/CODEX'
    doc_exts: ['.txt', '.md']

  - heading: 'IV. DIGESTS (THE NARRATIVE)'
    doc_dirs:
      - 'G:/My Drive/THE_LEAGUE/DIGESTS'
    doc_exts: ['.txt', '.md']

  - heading: 'V. NOTEBOOKS (THE LEDGER)'
    doc_dirs:
      - 'G:/My Drive/THE_LEAGUE/NOTEBOOKS'
    doc_exts: ['.txt', '.md', '.json']   # allow json if you export jlogs

  - heading: 'VI. CODE (THE BUILD)'
    code_dirs:
        - 'code'         # add more folders as needed, e.g. 'src', 'packages/api'
    exclude_globs:
        - '**/__pycache__/*'
        - '.venv/*'
        - '**/*.pyc'
        # Optional: narrow to specific code types; omit to use defaults
        # code_exts: ['.py', '.toml', '.json', '.yaml', '.yml']

  - heading: 'VII. SUPPLEMENTALS'
    doc_dirs:
      - 'G:/My Drive/THE_LEAGUE/SUPPLEMENTAL DOCS'
    doc_exts: ['.txt', '.md']
